assumptions:
- Submission deadline is 2026-10-23 15:00 KST (from CLAUDE.md, not the interview)
- Python 3.14 is the target, stepping down to 3.13 then 3.12 if install fails, with
  the change recorded in README (from CLAUDE.md)
- REFUSAL_MESSAGES keys are injection, off_topic, third_party, real_estate, explicit
  (from CLAUDE.md)
- Output validation regenerates once and then drops the violating claim (CLAUDE.md
  wording; the interview said only 'regenerate or drop')
- If a request mixes a normal question with a real-estate or off-domain part, only
  that part is refused and the rest is answered; fatalism is reframed as cautions
  with a disclaimer (from CLAUDE.md)
- Month boundaries are 절입일 judged at 23:59 KST, and a plan's solar month maps to the
  절기 month containing its 15th day (from CLAUDE.md)
- Tests use the standard-library unittest runner (pytest is not installed). tests/test_birth_parser.py
  and tests/test_guards.py exist; tests/test_reference_date.py, tests/test_retriever.py,
  tests/test_output_validation.py, tests/test_api.py, tests/test_privacy.py and tests/test_eval_rules.py
  are still to be written, and all run without Bedrock, using mocks where an LLM step
  is involved
- data/places/regions.json and data/places/travel.json are JSON objects with a _meta
  key plus a regions / travel list
- evaluation/references.json is a JSON object whose keys are CSV row ids plus a _meta
  key
- The judge uses JUDGE_MODEL (Sonnet 4.5 by default), independent of SAJU_LLM_MODEL,
  at temperature 0, scoring 1-5 once, and Bedrock transient errors are retried twice;
  round 1 was answered and judged by Haiku 4.5 before this rule and is re-judged with
  JUDGE_MODEL once the Sonnet quota resets
- The evaluation harness (run_eval.py) is checked by tests/test_eval_rules.py, which
  is still to be written
- Package versions follow the reference repo C:\Users\SDS\Desktop\sds-ax-practice
  (from CLAUDE.md)
ontology_schema:
  name: SajuLifePlanQuery
  description: 'One stateless request/response cycle of the saju life planner: a masked
    question, the parsed birth profile, the saju calculation for the pinned 12-month
    window, the intent-routed specialist outputs, grounded claims, retrieved contexts
    and the request trace'
  fields:
  - name: question
    type: string
    description: Natural-language input from POST /query; inline birth span replaced
      by <BIRTH> before any LLM, log or trace
    required: true
  - name: birth_profile
    type: object
    description: 'Parser output: date, calendar (solar/lunar), leap, gender, hour_known,
      hour; exists only in the parser and saju MCP call args'
    condition: present only when the parser extracted valid birth data
    required: false
  - name: clarification
    type: string
    description: Clarification message returned with no LLM call when the birth data
      is ambiguous or invalid
    condition: present only when the parser asked for clarification
    required: false
  - name: reference_date
    type: string
    description: Pinned anchor date (default 2026-10-21, env SAJU_REFERENCE_DATE)
      passed as MCP now, prompt 기준일 and trace
    condition: always recorded in trace and reports; not a request field
    required: false
  - name: luck_calendar
    type: array
    description: 12 절기 months with date ranges and 월운 간지 from mcp-saju get_luck_calendar
    condition: present only when birth data was parsed
    required: false
  - name: saju
    type: object
    description: 'ssaju results: pillars, 십성, 용신, 세운; never inferred by the LLM'
    condition: present only when birth data was parsed
    required: false
  - name: intent
    type: string
    description: 'Routing decision: which specialists (saju, travel, residence, plan)
      to call'
    condition: present only when the request passed the input guard
    required: false
  - name: travel_picks
    type: array
    description: Per-month domestic and overseas travel picks chosen from tool-ranked
      candidates
    condition: present only when travel_agent ran
    required: false
  - name: residence_top3
    type: array
    description: Top 3 residence regions with good and bad move months
    condition: present only when residence_agent ran
    required: false
  - name: plan_evaluations
    type: array
    description: User plans rated 좋음/보통/주의 with DB alternatives
    condition: present only when plan_agent ran
    required: false
  - name: claims
    type: array
    description: Structured answer claims [{text, doc_ids}] checked by output validation
    condition: present only for answers composed by the LLM (not refusals or clarifications)
    required: false
  - name: answer
    type: string
    description: User-facing answer text without doc_id tags, or a fixed REFUSAL_MESSAGES
      text
    required: true
  - name: contexts
    type: array
    description: '[{doc_id, text, source?, doc_type?}] from RAG (rule, place) and
      MCP tools (mcp:*)'
    required: true
  - name: trace
    type: array
    description: Ordered [{step, input, output, type?, name?, latency_ms?}], masked
      and truncated to 300 chars
    required: true
  - name: total_latency_ms
    type: number
    description: Optional wall-clock time of the request
    condition: optional top-level response field
    required: false
  - name: place_doc
    type: object
    description: 'A place row from data/places (region or travel): id, name, direction,
      elements, env_tags, description, best_months for travel; doc_id = id'
    condition: present in contexts when a travel or residence tool or place retrieval
      returned it
    required: false
  - name: rule_chunk
    type: object
    description: 'A section of data/rules/*.md: doc_id rule:<topic>:<slug>, title, body'
    condition: present in contexts when retrieve_docs returned it
    required: false
  - name: specialist_agent
    type: string
    description: One of saju_agent, travel_agent, residence_agent, plan_agent; appears
      in trace as agent:<name>
    condition: present when intent routing selected it
    required: false
  - name: guard_decision
    type: object
    description: 'Input guard result: action (allow, block, partial) and category
      (a REFUSAL_MESSAGES key or none)'
    condition: recorded in trace as guard:input on every request
    required: false
  - name: refusal
    type: string
    description: The fixed REFUSAL_MESSAGES string returned or appended for a blocked
      category
    condition: present only when guard_decision is block or partial
    required: false
evaluation_principles:
- name: privacy
  description: Raw birth data never reaches the LLM, logs, trace or eval artifacts;
    only <BIRTH> appears
  weight: 1.0
- name: guardrail_correctness
  description: 'All guardrail rows pass by rule: exact fixed refusal text, whole-request
    refusal for injection, reframing with disclaimer for fatalism'
  weight: 1.0
- name: groundedness
  description: Every claim cites a doc_id present in contexts; 간지/용신 come only from
    ssaju and places only from tool-ranked DB candidates
  weight: 0.9
- name: contract_fidelity
  description: POST /query, CSV columns, folder layout and trace naming follow the
    course rules exactly, with only optional additions
  weight: 0.9
- name: determinism_reproducibility
  description: Pinned reference date, deterministic parser, scoring and query expansion
    give identical results in the grader's environment
  weight: 0.8
- name: answer_quality
  description: The LLM judge scores at least 4/5 on expected_traits for non-guardrail
    rows; intent-routed answers include only the sections asked for
  weight: 0.8
- name: retrieval_quality
  description: RAGAS faithfulness, answer_relevancy, context_precision and context_recall
    aggregates improve from round 1 to round 2
  weight: 0.6
exit_conditions:
- name: pass_bar_met
  description: The live evaluation meets the course pass bar and all deliverables
    are committed
  criteria: Round report shows at least 20 of 24 passed and guardrail 8/8; unit tests
    pass; README, SERVICE.md and round1/round2 reports are present
- name: deadline_reached
  description: Submission deadline reached
  criteria: 'Day 10 submission time: push the current state to public GitHub and record
    the failing rows and known gaps in the round 2 report'
- name: bedrock_quota_exhausted
  description: The Bedrock daily token quota runs out during a round
  criteria: Record unfinished rows as failures, rerun answers with SAJU_LLM_MODEL if
    needed, re-judge saved answers with JUDGE_MODEL after the quota resets, and label
    the round with both models; deterministic criteria (unit tests, data checks) still
    have to pass
- name: privacy_violation_blocker
  description: A raw-birth-data leak is found and cannot be fixed
  criteria: Any raw birth string in LLM prompts, trace, logs or eval outputs halts
    submission until it is fixed
